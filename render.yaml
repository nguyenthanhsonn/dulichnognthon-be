# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: dulichnongthon-be
    runtime: node
    repo: https://github.com/nguyenthanhsonn/dulichnognthon-be
    branch: main
    region: ohio
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Thêm VOTING_START_AT/VOTING_END_AT thủ công khi có lịch chính thức.
      # Chưa có hai biến này thì bình chọn đóng.
      - key: MAX_VOTES_PER_USER
        value: '3'
      - key: OTP_EXPIRES_SECONDS
        value: '300'
      - key: OTP_MAX_ATTEMPTS
        value: '3'
      - key: AUTH_JWT_SECRET
        sync: false
      - key: AUTH_OTP_SECRET
        sync: false
      # Render Free chặn SMTP phổ biến; gửi email bằng HTTPS API.
      - key: EMAIL_PROVIDER
        value: resend
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_SEND_COOLDOWN_SECONDS
        value: '60'
      - key: OTP_MAX_SENDS_PER_HOUR
        value: '5'
      - key: TRUST_PROXY_HOPS
        value: '1'
