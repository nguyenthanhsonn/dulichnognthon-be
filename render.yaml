# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: dulichnongthon-be
    runtime: node
    repo: https://github.com/nguyenthanhsonn/dulichnognthon-be
    branch: main
    region: ohio
    # Gmail API dùng HTTPS, không cần mở cổng SMTP.
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Thêm VOTING_START_AT/VOTING_END_AT thủ công khi có lịch chính thức.
      # Chưa có hai biến này thì bình chọn đóng.
      - key: MAX_VOTES_PER_USER
        value: '3'
      - key: OTP_EXPIRES_SECONDS
        value: '300'
      - key: OTP_MAX_ATTEMPTS
        value: '3'
      - key: AUTH_JWT_SECRET
        sync: false
      - key: AUTH_OTP_SECRET
        sync: false
      # Production dùng Gmail API qua HTTPS với OAuth của tài khoản gửi.
      - key: EMAIL_PROVIDER
        value: gmail_api
      - key: MAIL_FROM
        value: mediaqtm@gmail.com
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: OTP_SEND_COOLDOWN_SECONDS
        value: '60'
      - key: OTP_MAX_SENDS_PER_HOUR
        value: '5'
      - key: TRUST_PROXY_HOPS
        value: '1'
